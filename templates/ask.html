<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>질문하기</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 120px; margin: 10px 0; padding: 10px; }
        button { padding: 10px 20px; font-size: 16px; }
        #answer { margin-top: 20px; padding: 15px; background: #f5f5f5; white-space: pre-wrap; min-height: 100px; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <a href="/">← 홈으로</a>
    <h1>내 노트에게 질문하기</h1>
    <textarea id="question" placeholder="질문을 입력하세요..."></textarea><br>
    <button onclick="ask()">질문하기</button>
    <div id="answer"></div>

    <script>
        async function ask() {
            const question = document.getElementById("question").value;
            if (!question) return alert("질문을 입력하세요");

            document.getElementById("answer").innerText = "답변 생성 중...";

            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });

            const data = await res.json();
            document.getElementById("answer").innerText = data.answer || "답변을 받지 못했습니다.";
        }
    </script>
</body>
</html>
